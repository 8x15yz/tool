<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess · Tools</title>
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #1a202c;
      --text-muted: #718096;
      --accent: #4f46e5;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 1.5rem;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      font-size: .825rem;
      color: var(--text-muted);
      text-decoration: none;
      margin-bottom: 1.2rem;
    }
    .back:hover { color: var(--accent); }

    h1 {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -.03em;
      margin-bottom: 1.2rem;
    }

    .layout {
      display: flex;
      gap: 1.5rem;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    #board {
      width: min(480px, calc(100vw - 3rem));
      flex-shrink: 0;
    }

    .panel {
      flex: 1 1 200px;
      display: flex;
      flex-direction: column;
      gap: .9rem;
      min-width: 200px;
      max-width: 280px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.1rem 1.2rem;
    }

    .card-title {
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: .75rem;
    }

    .seg {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .seg button {
      flex: 1;
      padding: .42rem .5rem;
      border: none;
      background: none;
      font-size: .8rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-muted);
      transition: background .12s, color .12s;
    }

    .seg button + button { border-left: 1px solid var(--border); }

    .seg button.active {
      background: var(--accent);
      color: #fff;
    }

    .color-row {
      display: flex;
      gap: .5rem;
      margin-top: .7rem;
    }

    .color-btn {
      flex: 1;
      padding: .38rem .4rem;
      border: 2px solid var(--border);
      border-radius: 8px;
      background: none;
      cursor: pointer;
      font-size: .78rem;
      font-weight: 600;
      color: var(--text-muted);
      transition: border-color .12s, color .12s;
    }

    .color-btn.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    .status-text {
      font-size: .9rem;
      font-weight: 700;
    }

    .status-text.check { color: #d97706; }
    .status-text.over  { color: #059669; }

    .thinking-text {
      font-size: .75rem;
      color: var(--accent);
      margin-top: .25rem;
      min-height: 1.1em;
    }

    .btn-new {
      width: 100%;
      padding: .6rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: .875rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .15s;
    }

    .btn-new:hover { opacity: .85; }

    .moves-list {
      font-size: .78rem;
      line-height: 1.9;
      max-height: 190px;
      overflow-y: auto;
      color: var(--text-muted);
      word-break: break-word;
    }

    .moves-list b { color: var(--text); }
  </style>
</head>
<body>

<a class="back" href="./index.html">← 돌아가기</a>
<h1>♟ Chess</h1>

<div class="layout">
  <div id="board"></div>

  <div class="panel">

    <div class="card">
      <div class="card-title">게임 모드</div>
      <div class="seg">
        <button id="btn-ai" class="active" onclick="setMode('ai')">vs AI</button>
        <button id="btn-2p" onclick="setMode('2p')">2인 대전</button>
      </div>
      <div class="color-row" id="color-row">
        <button class="color-btn active" id="btn-white" onclick="setColor('white')">⬜ 백</button>
        <button class="color-btn" id="btn-black" onclick="setColor('black')">⬛ 흑</button>
      </div>
    </div>

    <div class="card" id="diff-card">
      <div class="card-title">AI 난이도</div>
      <div class="seg">
        <button id="btn-easy"   onclick="setDiff('easy')">쉬움</button>
        <button id="btn-medium" class="active" onclick="setDiff('medium')">보통</button>
        <button id="btn-hard"   onclick="setDiff('hard')">어려움</button>
      </div>
    </div>

    <div class="card">
      <div class="status-text" id="status">백 차례</div>
      <div class="thinking-text" id="thinking"></div>
    </div>

    <button class="btn-new" onclick="newGame()">새 게임</button>

    <div class="card">
      <div class="card-title">기보</div>
      <div class="moves-list" id="moves">—</div>
    </div>

  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script>
'use strict';

let game, board, engine, engineReady = false, engineThinking = false;
let gameMode = 'ai', playerColor = 'white', difficulty = 'medium';

const DIFF = {
  easy:   { skill: 3,  movetime: 300 },
  medium: { skill: 10, movetime: 800 },
  hard:   { skill: 20, movetime: 2000 },
};

// ── Engine (Stockfish via blob worker) ─────────────────────────────────────

function initEngine() {
  try {
    const src = `importScripts('https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js')`;
    engine = new Worker(URL.createObjectURL(new Blob([src], { type: 'application/javascript' })));
    engine.onmessage = handleEngineMsg;
    engine.onerror   = () => { engine = null; };
    engine.postMessage('uci');
  } catch (e) { engine = null; }
}

function handleEngineMsg(e) {
  const line = e.data;
  if (line === 'uciok')   engine.postMessage('isready');
  if (line === 'readyok') engineReady = true;
  if (line.startsWith('bestmove')) {
    engineThinking = false;
    setThinking(false);
    const mv = line.split(' ')[1];
    if (mv && mv !== '(none)') {
      game.move({ from: mv.slice(0, 2), to: mv.slice(2, 4), promotion: mv[4] || 'q' });
      board.position(game.fen());
      updateStatus();
      updateMoves();
    }
  }
}

function askEngine() {
  if (!engine || !engineReady || engineThinking || game.game_over()) return;
  const { skill, movetime } = DIFF[difficulty];
  engineThinking = true;
  setThinking(true);
  engine.postMessage(`setoption name Skill Level value ${skill}`);
  engine.postMessage(`position fen ${game.fen()}`);
  engine.postMessage(`go movetime ${movetime}`);
}

// ── Board ──────────────────────────────────────────────────────────────────

function initBoard() {
  game = new Chess();
  board = Chessboard('board', {
    draggable: true,
    position: 'start',
    orientation: 'white',
    pieceTheme: 'https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/img/chesspieces/wikipedia/{piece}.png',
    onDragStart, onDrop, onSnapEnd,
  });
}

function onDragStart(source, piece) {
  if (game.game_over() || engineThinking) return false;
  const t = game.turn();
  if (gameMode === 'ai' && t !== playerColor[0]) return false;
  if (t === 'w' && piece[0] === 'b') return false;
  if (t === 'b' && piece[0] === 'w') return false;
  return true;
}

function onDrop(source, target) {
  const move = game.move({ from: source, to: target, promotion: 'q' });
  if (!move) return 'snapback';
  updateStatus();
  updateMoves();
  if (gameMode === 'ai' && !game.game_over()) setTimeout(askEngine, 200);
}

function onSnapEnd() { board.position(game.fen()); }

// ── UI ─────────────────────────────────────────────────────────────────────

function updateStatus() {
  const el = document.getElementById('status');
  const turn = game.turn() === 'w' ? '백 (White)' : '흑 (Black)';
  let txt = '', cls = '';

  if (game.in_checkmate()) {
    const winner = game.turn() === 'w' ? '흑 승리!' : '백 승리!';
    txt = `체크메이트 — ${winner}`; cls = 'over';
  } else if (game.in_draw()) {
    txt = '무승부'; cls = 'over';
    if (game.in_stalemate())                 txt += ' (스테일메이트)';
    else if (game.in_threefold_repetition()) txt += ' (3회 반복)';
    else if (game.insufficient_material())   txt += ' (기물 부족)';
  } else {
    txt = `${turn} 차례`;
    if (game.in_check()) { txt += ' · 체크!'; cls = 'check'; }
  }

  el.textContent = txt;
  el.className = 'status-text ' + cls;
}

function setThinking(on) {
  document.getElementById('thinking').textContent = on ? '⏳ AI 생각 중...' : '';
}

function updateMoves() {
  const h = game.history();
  const el = document.getElementById('moves');
  if (!h.length) { el.innerHTML = '—'; return; }
  let html = '';
  for (let i = 0; i < h.length; i += 2) {
    const n = i / 2 + 1;
    html += `${n}. <b>${h[i]}</b>${h[i + 1] ? ' <b>' + h[i + 1] + '</b>' : ''} `;
  }
  el.innerHTML = html;
  el.scrollTop = el.scrollHeight;
}

function setMode(m) {
  gameMode = m;
  document.getElementById('btn-ai').classList.toggle('active', m === 'ai');
  document.getElementById('btn-2p').classList.toggle('active', m === '2p');
  document.getElementById('color-row').style.display = m === 'ai' ? '' : 'none';
  document.getElementById('diff-card').style.display = m === 'ai' ? '' : 'none';
  newGame();
}

function setColor(c) {
  playerColor = c;
  document.getElementById('btn-white').classList.toggle('active', c === 'white');
  document.getElementById('btn-black').classList.toggle('active', c === 'black');
  newGame();
}

function setDiff(d) {
  difficulty = d;
  ['easy', 'medium', 'hard'].forEach(x =>
    document.getElementById('btn-' + x).classList.toggle('active', x === d)
  );
}

function newGame() {
  if (engine && engineThinking) { engine.postMessage('stop'); engineThinking = false; }
  game = new Chess();
  board.orientation(gameMode === 'ai' ? playerColor : 'white');
  board.position('start');
  updateStatus();
  updateMoves();
  setThinking(false);
  if (gameMode === 'ai' && playerColor === 'black') setTimeout(askEngine, 500);
}

// ── Init ───────────────────────────────────────────────────────────────────
initEngine();
initBoard();
updateStatus();
</script>
</body>
</html>
