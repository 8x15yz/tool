<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tools</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #1a202c;
      --text-muted: #718096;
      --accent: #4f46e5;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -.03em;
    }

    header p {
      margin-top: .4rem;
      font-size: .875rem;
      color: var(--text-muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 1.1rem;
      width: 100%;
      max-width: 600px;
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: .65rem;
      padding: 1.5rem 1.4rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      text-decoration: none;
      color: inherit;
      transition: box-shadow .15s, transform .15s, border-color .15s;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }

    .card:hover {
      box-shadow: 0 6px 24px rgba(79,70,229,.13);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .card-icon { font-size: 1.8rem; }

    .card-title {
      font-size: .975rem;
      font-weight: 700;
    }

    .card-desc {
      font-size: .8rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    footer {
      margin-top: 2.5rem;
      font-size: .72rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <header>
    <h1>🛠 Tools</h1>
    <p>간단한 도구 모음</p>
  </header>

  <div class="grid">
    <a class="card" href="./mdmemo.html">
      <div class="card-icon">📝</div>
      <div class="card-title">MD 에디터</div>
      <div class="card-desc">마크다운 메모를 WYSIWYG 방식으로 빠르게 작성</div>
    </a>
    <a class="card" href="./schedule.html">
      <div class="card-icon">📅</div>
      <div class="card-title">ICS 일정 뷰어</div>
      <div class="card-desc">Outlook · Teams · Google Calendar의 .ics 파일을 브라우저에서 바로 확인</div>
    </a>
    <!-- 추가된 removepath 카드 -->
    <a class="card" href="./removepath.html">
      <div class="card-icon">🧹</div>
      <div class="card-title">HTML 태그 제거</div>
      <div class="card-desc">HTML/티스토리 태그와 스타일을 제거하고 순수 원문 텍스트만 추출</div>
    </a>
  </div>

  <footer>로컬 전용 · 서버 없음</footer>
</body>
</html>
