<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MD Editor</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vditor@3.10.8/dist/index.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #fff; }
    #editor { height: 100vh; width: 80%; margin: 0 auto; }
    .vditor { width: 100% !important; }
    .vditor-content { width: 100% !important; }
    .vditor-wysiwyg { width: 100% !important; }
    .vditor-wysiwyg-preview { width: 100% !important; }
    .vditor-info { display: none !important; }
    #home-btn {
      position: fixed;
      top: 10px;
      left: 14px;
      z-index: 999;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: .75rem;
      font-weight: 600;
      color: #718096;
      text-decoration: none;
      background: rgba(255,255,255,.85);
      backdrop-filter: blur(6px);
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: .3rem .65rem;
      transition: background .12s, color .12s;
    }
    #home-btn:hover { background: #fff; color: #1a202c; }
  </style>
</head>
<body>
  <a id="home-btn" href="./index.html">← 홈</a>
  <div id="editor"></div>
  <script src="https://cdn.jsdelivr.net/npm/vditor@3.10.8/dist/index.min.js"></script>
  <script>
    new Vditor('editor', {
      mode: 'wysiwyg',
      toolbar: [],
      toolbarConfig: { hide: true },
      height: window.innerHeight,
      placeholder: '마크다운으로 작성하세요  (#, ##, **, *, >, -, ` 등)',
      counter: { enable: false },
      resize: { enable: false },
      cache: { enable: false },
    });

    window.addEventListener('resize', () => {
      document.querySelector('.vditor').style.height = window.innerHeight + 'px';
    });
  </script>
</body>
</html>
