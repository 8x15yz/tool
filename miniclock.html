<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>MiniClock 다운로드</title>
	<style>
		:root { color-scheme: dark; --bg: #10131a; --card: #1a1f2b; --accent: #66e3b4; --muted: #aab3c4; }
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #f5f7fb; background: radial-gradient(circle at top, #26344a, var(--bg) 60%); }
		main { width: min(920px, 100%); overflow: hidden; border: 1px solid #30394a; border-radius: 24px; background: rgba(26,31,43,.94); box-shadow: 0 24px 80px #0008; }
		.hero { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-items: center; padding: clamp(28px, 6vw, 64px); }
		.eyebrow { color: var(--accent); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: .8rem; }
		h1 { margin: 10px 0 14px; font-size: clamp(2.2rem, 6vw, 4.5rem); line-height: .98; }
		p { color: var(--muted); line-height: 1.7; }
		.actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
		.button { display: inline-block; padding: 13px 20px; border-radius: 10px; text-decoration: none; font-weight: 700; background: var(--accent); color: #10241e; }
		.button.secondary { border: 1px solid #465166; background: transparent; color: #f5f7fb; }
		.preview { display: grid; place-items: center; min-height: 300px; border: 1px solid #354052; border-radius: 18px; background: #0d1016; }
		.preview img { display: block; max-width: 100%; max-height: 300px; object-fit: contain; border-radius: 12px; }
		.placeholder { padding: 40px; text-align: center; color: var(--muted); }
		.details { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 22px clamp(28px, 6vw, 64px); border-top: 1px solid #30394a; }
		.details strong { display: block; margin-bottom: 5px; color: #fff; }
		.details span { color: var(--muted); font-size: .9rem; }
		footer { padding: 0 clamp(28px, 6vw, 64px) 28px; color: #7f8a9e; font-size: .82rem; }
		@media (max-width: 680px) { .hero { grid-template-columns: 1fr; } .details { grid-template-columns: 1fr; } }
	</style>
</head>
<body>
	<main>
		<section class="hero">
			<div>
				<div class="eyebrow">Desktop Widget</div>
				<h1>MiniClock</h1>
				<p>언제든 한눈에 시간을 확인할 수 있는 가볍고 심플한 데스크톱 시계 위젯입니다.</p>
				<div class="actions">
					<!-- exe 파일명을 실제 파일명으로 바꿔 주세요. -->
					<a class="button" href="./miniclock/MiniClock.exe" download>MiniClock 다운로드</a>
					<a class="button secondary" href="#info">자세히 보기</a>
				</div>
			</div>
			<div class="preview" aria-label="MiniClock 미리보기">
				<!-- 소개 PNG를 ./miniclock/miniclock.png에 넣으면 표시됩니다. -->
				<img src="./miniclock/miniclock.png" alt="MiniClock 실행 화면" onerror="this.hidden=true; this.nextElementSibling.hidden=false">
				<div class="placeholder" hidden>MiniClock<br>Preview</div>
			</div>
		</section>
		<section class="details" id="info">
			<div><strong>가볍고 빠르게</strong><span>시스템 부담 없이 실행</span></div>
			<div><strong>깔끔한 화면</strong><span>필요한 정보만 간단하게</span></div>
			<div><strong>Windows 지원</strong><span>다운로드 후 바로 실행</span></div>
		</section>
		<footer>MiniClock · Portable desktop widget</footer>
	</main>
</body>
</html>
